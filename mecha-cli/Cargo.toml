[package]
name = "mecha-cli"
description = "The mecha CLI: a standalone agent harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mecha"
path = "src/main.rs"

[dependencies]
mecha-core = { path = "../mecha-core" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap = { version = "4", features = ["derive", "env"] }
futures.workspace = true
rustyline = "15"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `unstable-rendered-line-info` gives Paragraph::line_count, which is how the
# transcript knows its own wrapped height and therefore how far it can scroll.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
