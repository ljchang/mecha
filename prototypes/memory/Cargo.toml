[package]
name = "mecha-memory-prototype"
version = "0.0.0"
edition = "2021"
publish = false

# Independent qualification harness; not part of the release workspace.
[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
