[package]
name = "mecha-mail"
description = "Gmail, Outlook, and their calendars behind one provider-neutral surface, with stdio MCP servers on top."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The library is the piece a GUI would depend on directly. The
# per-provider binaries serve one provider each with its own credential
# store; `mecha-mail` serves every account in ~/.mecha/mail behind one
# provider-neutral surface, which is the one deployments should wire.
[[bin]]
name = "mecha-google"
path = "src/bin/mecha-google.rs"

[[bin]]
name = "mecha-outlook"
path = "src/bin/mecha-outlook.rs"

[[bin]]
name = "mecha-mail"
path = "src/bin/mecha-mail.rs"

# Documents are a fourth surface rather than a fourth crate: a crate here
# exists to make an invariant checkable in Cargo.toml, and this one would
# enforce none while needing token.rs's refresh lifecycle. See
# docs/DOCS-RESEARCH.md section 7.
[[bin]]
name = "mecha-docs"
path = "src/bin/mecha-docs.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.23"
chrono.workspace = true
chrono-tz.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs.workspace = true
futures.workspace = true
htmd = "0.5"
# The bookings sweep's advisory flock — same mechanism as mecha-core's
# outbox, for the same reason: two sweeps must not both create an event.
libc = "0.2"
pulldown-cmark = "0.13"
rand = "0.10"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tiny_http = "0.12"
toml.workspace = true
# io-std on top of the workspace set: stdout is each binary's MCP transport.
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
