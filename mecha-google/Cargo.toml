[package]
name = "mecha-google"
description = "Gmail and Google Calendar client, extracted from flowmail, with a stdio MCP server on top."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The library is the piece a future flowmail depends on directly; the binary
# is the MCP face mecha (or any MCP client) connects to.
[[bin]]
name = "mecha-google"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs.workspace = true
htmd = "0.1"
pulldown-cmark = "0.13"
rand = "0.8"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tiny_http = "0.12"
# io-std on top of the workspace set: stdout is this binary's MCP transport.
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
