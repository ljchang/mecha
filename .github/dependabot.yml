version: 2

updates:
  # Rust dependencies. Grouped so a routine week is one pull request rather
  # than fifteen, each of which would otherwise trigger a CI run and a review.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  # The documentation site.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # `typescript` rides with Docusaurus rather than moving on its own,
      # because Docusaurus decides what it may be. TS 7 removed `baseUrl`,
      # which `@docusaurus/tsconfig` sets at line 14 of its own file — a
      # config a child cannot override — so `npm run typecheck` fails on 7
      # while the site still builds. The version is theirs to choose; ours
      # only to follow.
      docusaurus:
        patterns: ["@docusaurus/*", "docusaurus*", "typescript"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A TypeScript major is adoptable when Docusaurus ships a tsconfig for
      # it, and not before. The Docusaurus bump is what will surface it, so a
      # standalone major here is only ever a PR to close again — #6 sat open
      # for five days being exactly that.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(docs)"

  # The workflows themselves. A pinned action that goes stale is a security
  # problem as much as a maintenance one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(ci)"
