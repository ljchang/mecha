# A release is a tag; the tag publishes the crates.
#
# Same shape as mecha-factory's release workflow, minus the box binary —
# mecha runs at home, so there is no deploy step, only crates.io. Trusted
# Publishing (GitHub OIDC → a 30-minute token) instead of a long-lived API
# token in the secrets of a public repository; the one-time setup per crate
# is in CONTRIBUTING.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publishing is the one step that cannot be retracted, so the full
      # test suite runs again here even though CI ran it on the merge — a
      # tag can be pushed from anywhere, and "it was green when I looked"
      # is not a gate.
      - run: cargo test --workspace
      - run: cargo clippy --all-targets
        env:
          RUSTFLAGS: -D warnings

      # A tag that does not match the workspace version would publish a
      # crate whose version disagrees with its own git tag forever.
      - name: The tag must be the workspace version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [[ "$TAG" == "$VERSION" ]] || {
            echo "tag v$TAG != workspace version $VERSION" >&2; exit 1; }

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Dependency order (mecha-cli stands on both mecha-core and
      # mecha-slack; mecha-mail stands on mecha-core), and "already
      # uploaded" is success rather than failure: re-running a tag's
      # workflow must be idempotent, and the first release of any crate is
      # published by hand (Trusted Publishing can only be configured on a
      # crate that exists).
      #
      # `mecha-slack` was missing from this list for one release cycle, and
      # the failure it would have caused is worth naming: cargo refuses to
      # publish a crate whose non-dev dependencies are not on the registry,
      # so `mecha-cli` would have failed *after* mecha-core and mecha-mail
      # had already uploaded — a half-published version that cannot be
      # retracted. **A new workspace member that anything published depends
      # on has to be added here in the same change that introduces it.**
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in mecha-core mecha-mail mecha-slack mecha-cli; do
            echo "== $crate"
            if out=$(cargo publish -p "$crate" 2>&1); then
              echo "$out"
            else
              echo "$out"
              echo "$out" | grep -Eq "already uploaded|already exists" || exit 1
              echo "== $crate: this version is already on crates.io; fine"
            fi
          done

  # The GitHub Release object, from the tag's own changelog section. Added
  # 2026-08-29, after fourteen tags had published crates with no release to
  # show for it: this workflow was never given the job, and its top-level
  # `contents: read` could not have done it anyway — the two releases that
  # existed (v0.1.0, v0.1.1) were made by hand during the factory sprint.
  # Gated on the crates job so a release is never announced for a version
  # whose crates did not go up, and idempotent so re-running a tag's
  # workflow does not fail on "already exists".
  github-release:
    runs-on: ubuntu-latest
    needs: crates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          awk -v ver="$V" '
            $0 ~ "^## \\["ver"\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > body.md
          # A tag with no changelog section still gets a release, honestly
          # labelled — a silent skip here is how the gap this job closes
          # opened in the first place.
          [ -s body.md ] || echo "_No CHANGELOG section found for ${V}._" > body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; fine"
          else
            gh release create "$TAG" --title "$TAG" --notes-file body.md --verify-tag
          fi
