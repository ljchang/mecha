name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      # The embedded demo is built from the web app at docs-build time, so a
      # change to the surface changes the docs. Without this a UI change ships
      # with the docs still showing the previous one.
      - "web/**"
      - "mecha-core/src/charter.rs"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "web/**"
      - "mecha-core/src/charter.rs"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# A pull-request build must not share a queue with main's deploy. GitHub holds
# only one *pending* run per concurrency group, so a third arrival evicts the
# one that is waiting — and on 2026-08-29 a PR build evicted the main-push
# deploy of PR #118 (run 33256024329 ran no jobs at all, created 13:50:09 and
# cancelled 13:54:56, the second the next PR run was created). It self-healed
# because the next push to main rebuilt from a fresh checkout, but that is
# luck: the `paths` filter above means a run of pushes touching only Rust or
# `docs/` re-triggers nothing, and the site sits stale behind a history that
# shows no failure — a cancelled run reads as neither pass nor fail.
#
# So deploys serialise only against each other, and PR builds serialise
# per-branch and supersede their own earlier runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every pull request too. `onBrokenLinks` is set to 'throw', so a
  # stale cross-reference fails here rather than shipping as a dead link.
  build:
    name: build
    runs-on: ubuntu-latest
    # A hung runner must not hold the deploy queue open. On 2026-08-29 this job
    # sat 45 minutes with every step reporting an empty conclusion — no step
    # ever completed — and that is what made the queue deep enough to start
    # evicting. A green build here takes ~1m30s.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      # The web settings page writes ~/.mecha/charter.toml and mecha-core
      # reads it; this fails when the two stop agreeing on the bytes. Cheap,
      # and it needs no build — hence first.
      - run: npm run check-charter-toml

      # Before the build, not after: this fails when the web app reaches an
      # endpoint the demo has no fixture for, which otherwise ships as a page
      # that renders its own error state and reads as a broken feature.
      - run: npm run check-demo

      - run: npm run build

      # The demo embeds the real web app, and neither of the steps above runs
      # a line of its JavaScript: `check-demo` reads fixtures and route tables,
      # and `docusaurus build` renders no client code. So a page of the app can
      # be broken with both green — v0.1.16 shipped exactly that, a `stalled`
      # ReferenceError that emptied the task board. This loads every page in a
      # browser and fails on an error, a page that drew almost nothing, or one
      # of the app's own "could not read that" affordances.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Render the embedded demo
        # Without this the check downgrades a missing browser to a warning, and
        # a silently skipped check in CI reads exactly like a passing one.
        env:
          MECHA_DOCS_REQUIRE_BROWSER: '1'
        run: npm run render-check

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
