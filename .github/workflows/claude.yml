name: Claude

# Interactive counterpart to the automatic review: mention @claude in an issue,
# a pull request, or a review comment and it picks the thread up from there.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    name: respond
    runs-on: ubuntu-latest
    # Only react to an explicit mention, so ordinary discussion stays quiet.
    #
    # `>-` and not `|`: a literal block keeps every newline and a trailing one
    # besides, and this job has never once run — a real `@claude` comment on a
    # pull request left it skipped in 0s with no steps at all. The review
    # workflow beside it spells its condition `>-` and its job does run. Every
    # line here stays at one indentation level, because a folded scalar only
    # folds lines that share it and keeps a deeper one literal.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Same credential as the review workflow — see the note there.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pinned rather than left to the action's default, which run logs
          # show is `claude-sonnet-5`.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(cargo check:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue comment:*),Bash(gh issue view:*)"
