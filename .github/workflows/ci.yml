name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so lint debt cannot accumulate silently.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `stable` is what contributors use; the MSRV pin is what the manifest
        # promises. Breaking either should be a deliberate act, not a surprise.
        # Keep this arm in step with `rust-version` in the workspace manifest.
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  # The integration tests skip themselves when a sandbox backend is missing, and
  # a silently skipped test reads exactly like a passing one. This job installs
  # the backends and sets MECHA_TEST_REQUIRE_BACKENDS=1, which turns every skip
  # into a failure — so "confinement works" is measured here, not assumed.
  backends:
    name: sandbox backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      # Installing bwrap is not enough on Ubuntu 23.10 and later, which is what
      # these runners are. AppArmor gained a separate switch that blocks
      # unprivileged user namespaces even when userns is otherwise permitted,
      # so `bwrap` fails with a confusing permissions error. This is the same
      # trap documented for end users in CLAUDE.md; the difference is that a
      # CI runner is disposable, so relaxing it here is fine.
      - name: Permit unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # The docker-backed tests check for the image locally rather than pulling
      # it themselves, so that a developer without network access gets a skip
      # instead of a hang. On a fresh runner that means it has to be fetched
      # here, or those tests report the backend as unavailable.
      # Both images the suite names: python:3-slim for the MCP server tests,
      # debian:stable-slim for the shell-confinement ones.
      - name: Pre-pull the sandbox images
        run: |
          docker pull python:3-slim
          docker pull debian:stable-slim

      - name: Report backend availability
        run: |
          echo "bwrap: $(bwrap --version 2>&1 || echo MISSING)"
          echo "docker: $(docker --version 2>&1 || echo MISSING)"
          echo "python3: $(python3 --version 2>&1 || echo MISSING)"
          echo "images: $(docker images --format '{{.Repository}}:{{.Tag}}' | tr '\n' ' ')"
          echo "-- proving bwrap actually runs, not just that it is installed:"
          bwrap --ro-bind / / --unshare-all true && echo "bwrap: WORKS" || echo "bwrap: PRESENT BUT NON-FUNCTIONAL"

      - name: Integration tests, with skips promoted to failures
        env:
          MECHA_TEST_REQUIRE_BACKENDS: "1"
        run: cargo test --workspace --locked --test sandbox_backends --test mcp_server

  # `mecha tools` runs with no provider configured, which makes it the cheapest
  # end-to-end check that the binary starts and the tool registry builds.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --bin mecha -- tools
      - run: cargo run --locked --bin mecha -- tools --json
