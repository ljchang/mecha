name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security vulnerability, please do not file it here — see
        [SECURITY.md](https://github.com/ljchang/mecha/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest sequence that shows it. A session transcript from
        `~/.mecha/sessions/` is the most useful thing you can attach — please
        check it for anything private before pasting.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mecha --version`, or the commit you built from.
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Which interface
      options: [run, chat, tui, batch, eval, trigger, other]
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: >
        For a local server, please include the `-c` it was started with — a
        stale `context_window` causes failures that look like something else.
      placeholder: anthropic / claude-opus-5, or llama-server -c 32768
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >
        The relevant part of your `mecha.toml`. Remove any API keys before
        pasting.
      render: toml

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Output with `MECHA_LOG=debug` set, if you have it.
      render: shell
