[workspace]
members = ["mecha-core", "mecha-cli", "mecha-mail", "mecha-slack"]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ljchang/mecha"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# IANA zones, so "3pm Thursday" survives a DST boundary. A fixed offset in
# config would be wrong twice a year, silently.
chrono-tz = "0.10"
dirs = "6"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "signal", "net"] }
# Socket Mode is a WebSocket, and it is the whole reason mecha dials Slack
# rather than Slack dialling a port on this machine. `rustls` rather than
# native-tls to match reqwest above — two TLS stacks in one binary is two
# certificate stores to reason about.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# SKILL.md frontmatter is YAML, which the Agent Skills standard fixes and ~40
# implementations read — so a portable skill is a YAML one, and the format is
# not ours to change.
#
# The obvious choices are all dead or unsafe: `serde_yaml` is archived
# (0.9.34+deprecated, 2024-03), `serde_yml` ships as a shim announcing its own
# unmaintenance and carries RUSTSEC-2025-0068 (unsoundness, segfaults via its
# serializer), and `serde_norway`/`serde_yaml_ng` are stale forks. The YAML
# organization's own `yaml-serde` is alive but pulls `libyaml-rs`, a C FFI
# binding — the wrong direction for the one parser in this repository that
# reads third-party-authored files.
#
# `serde-saphyr` is stable at 1.x, depends on `serde_core` and nothing else,
# is explicitly designed not to panic on malformed input, carries configurable
# budgets against resource exhaustion, and refuses tag-driven object
# instantiation, which is the classic YAML remote-code-execution class. A
# panic here would take down every run at startup, since skills load before
# the agent does.
serde-saphyr = "1"

[profile.release]
opt-level = 3
lto = "thin"
