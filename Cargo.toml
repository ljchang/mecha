[workspace]
members = ["mecha-core", "mecha-cli", "mecha-mail", "mecha-slack"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ljchang/mecha"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# IANA zones, so "3pm Thursday" survives a DST boundary. A fixed offset in
# config would be wrong twice a year, silently.
chrono-tz = "0.10"
dirs = "6"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "signal", "net"] }
# Socket Mode is a WebSocket, and it is the whole reason mecha dials Slack
# rather than Slack dialling a port on this machine. `rustls` rather than
# native-tls to match reqwest above — two TLS stacks in one binary is two
# certificate stores to reason about.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
