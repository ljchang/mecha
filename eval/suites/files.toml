# Multi-step file work: chaining reads, arithmetic across files, a long chain of entries, and two code fixes graded by running the tests.
#
# A baseline measurement in the default environment (eval/envs/default): one
# arm, no control, three seeds, so `mecha exp report` can show pass^k. To
# compare a variant, add an arm with a prediction and name `control = "full"`,
# e.g. an arm whose `environment` extends the default with the change.
# Run from the checkout root.
name = "suite-files"
split_seed = 1
seeds = [1, 2, 3]

[tasks]
cases = "eval/cases.jsonl"
fixture = "eval/workspace"
ids = ["list-then-read", "cross-file", "readme-then-changelog", "csv-rows", "cost-arithmetic", "overtime-rule", "chain-total", "chain-largest", "kata-median", "kata-bugfix"]

[arms.full]
preset = "full"
