# Recommendation letters: drafting from the template, the form's structured answers and the student's docs, and saying plainly that free-text answers are not readable.
#
# A baseline measurement in the assistant environment (eval/envs/assistant):
# one arm, no control, three seeds. Staged writes (docs, poll creation, the
# reply to whoever asked) are graded by the arguments of the staged call.
# Run from the checkout root.
name = "suite-recletter"
split_seed = 1
seeds = [1, 2, 3]

[environment]
dir = "eval/envs/assistant"

[tasks]
cases = "eval/suites/assistant.jsonl"
fixture = "eval/workspace"
tags = ["recletter"]

[arms.full]
preset = "full"
