<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>mecha·voice</title>
<style>
/* mecha·voice — docs/VOICE-RESEARCH.md D7 (sound design) + D9 (transcript
   pane). Self-contained on purpose: no external fetch, ever — the page must
   work on the tailnet with nothing else reachable, like the harness itself.
   Two voices, two temperatures: the machine is copper, the human is steel. */
:root {
  --ground: #14110c;
  --surface: #1e1913;
  --line: #322a1f;
  --copper: #d08b4c;
  --copper-hot: #f0b268;
  --steel: #86a7c4;
  --ink: #ede6da;
  --muted: #8f8674;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
  --prose: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--prose);
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overflow: hidden;
}
header {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.wordmark { font-family: var(--mono); font-size: 15px; letter-spacing: .08em; color: var(--ink); }
.wordmark b { color: var(--copper); font-weight: 600; }
#linkstate { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#linkstate.live { color: var(--copper); }
#linkstate::before { content: "● "; }

#transcript {
  flex: 1; overflow-y: auto; padding: 16px 18px 8px;
  display: flex; flex-direction: column; gap: 10px;
  overscroll-behavior: contain;
}
.empty {
  margin: auto; text-align: center; color: var(--muted);
  font-family: var(--mono); font-size: 12px; letter-spacing: .1em; line-height: 2;
}
.line { max-width: 86%; line-height: 1.45; font-size: 15px; animation: rise .25s ease both; }
.line .who {
  font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; display: block; margin-bottom: 3px;
}
.line.user { align-self: flex-end; text-align: right; }
.line.user .who { color: var(--steel); }
.line.user .text { color: var(--ink); }
.line.bot { align-self: flex-start; }
.line.bot .who { color: var(--copper); }
.line.bot .text { color: var(--ink); }
.line.interim .text { color: var(--muted); font-style: italic; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

#dock {
  flex: none; display: flex; flex-direction: column; align-items: center;
  gap: 10px; padding: 14px 0 calc(18px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--surface);
}
#core {
  --level: 0;
  width: 96px; height: 96px; border-radius: 50%;
  border: none; cursor: pointer; position: relative;
  background: radial-gradient(circle at 50% 42%, #2b2115, #191510 70%);
  box-shadow: 0 0 0 2px var(--line), 0 0 24px rgba(208,139,76,.06);
  transition: box-shadow .4s ease;
  -webkit-tap-highlight-color: transparent;
}
#core:focus-visible { outline: 2px solid var(--steel); outline-offset: 4px; }
#core .ring {
  position: absolute; inset: -7px; border-radius: 50%;
  border: 2px solid transparent; pointer-events: none;
}
/* idle: dim ember */
#core.idle { box-shadow: 0 0 0 2px var(--line), 0 0 18px rgba(208,139,76,.10); }
/* connecting: slow pulse */
#core.connecting .ring { border-color: var(--muted); animation: pulse 1.6s ease-in-out infinite; }
/* listening: the ember breathes with the real mic level (JS drives --level) */
#core.listening {
  box-shadow: 0 0 0 2px var(--copper),
              0 0 calc(18px + var(--level) * 60px) rgba(240,178,104, calc(.18 + var(--level) * .6));
}
/* thinking: a single copper spark orbits */
#core.thinking .ring {
  border-top-color: var(--copper-hot);
  animation: orbit 1.4s linear infinite;
}
/* speaking: rings radiate outward */
#core.speaking .ring { border-color: var(--copper); animation: radiate 1.2s ease-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); opacity: .5; } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes radiate {
  from { transform: scale(1); opacity: .8; }
  to { transform: scale(1.45); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .ring, .line { animation: none !important; }
  #core.thinking { box-shadow: 0 0 0 2px var(--copper-hot); }
  #core.speaking { box-shadow: 0 0 0 3px var(--copper); }
}
#status {
  font-family: var(--mono); font-size: 12px; letter-spacing: .18em;
  text-transform: lowercase; color: var(--muted); min-height: 1em;
}
#core.listening + #status, #core.speaking + #status { color: var(--copper); }

/* The voice controls sit under the status line and stay deliberately
   quiet: the core is the page's one loud object, and a row of chrome
   competing with it would undo D7's whole point. Hidden until the worker
   answers with a voice list — a control that cannot yet do anything is
   worse than no control, and "could not ask" must not render as "no
   voices" (the dash rule, one layer down). */
#controls {
  display: none; align-items: center; gap: 14px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  color: var(--muted);
}
#controls.ready { display: flex; }
#controls label { display: flex; align-items: center; gap: 7px; }
#voice {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  color: var(--ink); background: var(--ground);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 22px 4px 8px; cursor: pointer;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 12px) 52%, calc(100% - 8px) 52%;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}
#voice:focus-visible, #speed:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
#speed {
  -webkit-appearance: none; appearance: none;
  width: 92px; height: 3px; border-radius: 2px; cursor: pointer;
  background: var(--line);
}
#speed::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--copper); border: none; cursor: pointer;
}
#speed::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--copper); border: none; cursor: pointer;
}
#speedval { color: var(--ink); min-width: 3.2em; }
#controls.refused #speedval, #controls.refused #voice { color: #c96a5a; }
</style>
</head>
<body>
<header>
  <span class="wordmark">mecha<b>·voice</b></span>
  <span id="linkstate">offline</span>
</header>
<main id="transcript">
  <div class="empty" id="empty">tap the core to connect<br>say something when the ring warms up</div>
</main>
<div id="dock">
  <button id="core" class="idle" aria-label="Connect and talk"><span class="ring"></span></button>
  <div id="status">tap to talk</div>
  <div id="controls">
    <label>voice
      <select id="voice" aria-label="Speaking voice"></select>
    </label>
    <label>rate
      <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"
             aria-label="Speaking rate">
      <span id="speedval">1.00×</span>
    </label>
  </div>
</div>
<script type="module">
import { createVoiceSession } from "./voice-core.js";

/* The page is a shell over voice-core.js — the same module the tailnet
   app's in-chat voice mode embeds, so the two shells cannot drift. All the
   machinery (chimes, barge-in, the end-sound-on-dead-network rule, RTVI)
   lives in the module; this file only owns the core button, the ring, and
   the transcript pane. */
const core = document.getElementById("core");
const statusEl = document.getElementById("status");
const linkEl = document.getElementById("linkstate");
const scroll = document.getElementById("transcript");
const emptyEl = document.getElementById("empty");

let interimEl = null;
function makeLine(who, interim, text = "") {
  const div = document.createElement("div");
  div.className = `line ${who}${interim ? " interim" : ""}`;
  div.innerHTML = `<span class="who">${who === "user" ? "you" : "mecha"}</span><span class="text"></span>`;
  div.querySelector(".text").textContent = text;
  return div;
}
function addLine({ who, text, interim }) {
  emptyEl.style.display = "none";
  if (who === "user" && interim) {
    if (!interimEl) {
      interimEl = makeLine("user", true);
      scroll.appendChild(interimEl);
    }
    interimEl.querySelector(".text").textContent = text;
  } else if (who === "user") {
    if (interimEl) { interimEl.remove(); interimEl = null; }
    scroll.appendChild(makeLine("user", false, text));
  } else {
    // The machine speaks in sentences; append to the open bot line so one
    // reply reads as one paragraph, not confetti.
    let last = scroll.lastElementChild;
    if (!(last && last.classList.contains("bot") && last.dataset.open === "1")) {
      last = makeLine("bot", false, "");
      last.dataset.open = "1";
      scroll.appendChild(last);
    }
    const t = last.querySelector(".text");
    t.textContent = (t.textContent ? t.textContent + " " : "") + text;
  }
  scroll.scrollTop = scroll.scrollHeight;
}

/* Voice controls. Two rules carry this:

   1. The server's answer is what renders. Every change is sent and the
      resulting state comes back over RTVI; nothing here paints an
      optimistic value. A slider that shows 1.6x while the worker refused
      it is the wrong-bytes review one layer down — you would be reading a
      control that describes a voice you are not hearing.
   2. Preferences are restored once per connection, never re-asserted.
      A settings echo that re-sends on every reply is a loop, and the
      thing it loops on is speech. */
const controls = document.getElementById("controls");
const voiceSel = document.getElementById("voice");
const speedEl = document.getElementById("speed");
const speedVal = document.getElementById("speedval");
const PREFS = "mecha.voice.prefs";

function loadPrefs() {
  // Storage can throw outright (private mode, blocked site data), so a
  // failure to read must degrade to "no preference", never to a crash on
  // a page whose main job is answering the phone.
  try { return JSON.parse(localStorage.getItem(PREFS)) || {}; } catch { return {}; }
}
function savePrefs(p) {
  try { localStorage.setItem(PREFS, JSON.stringify(p)); } catch { /* not worth a word */ }
}

let restored = false;
function onVoiceConfig(cfg) {
  if (!cfg.voices || !cfg.voices.length) return;  // unknown ≠ empty: stay hidden
  if (voiceSel.options.length !== cfg.voices.length) {
    voiceSel.innerHTML = "";
    for (const v of cfg.voices) {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      voiceSel.appendChild(o);
    }
  }
  voiceSel.value = cfg.voice;
  speedEl.value = cfg.speed;
  speedVal.textContent = Number(cfg.speed).toFixed(2) + "×";
  controls.classList.add("ready");
  controls.classList.toggle("refused", !!cfg.refused);
  if (cfg.refused) setTimeout(() => controls.classList.remove("refused"), 1200);

  if (!restored) {
    restored = true;
    const p = loadPrefs();
    const patch = {};
    if (p.voice && p.voice !== cfg.voice && cfg.voices.includes(p.voice)) patch.voice = p.voice;
    if (p.speed && Math.abs(p.speed - cfg.speed) > 0.01) patch.speed = p.speed;
    if (Object.keys(patch).length) session.voiceConfig(patch);
  } else {
    savePrefs({ voice: cfg.voice, speed: cfg.speed });
  }
}

const session = createVoiceSession({
  onVoiceConfig,
  onState(name, label) { core.className = name; statusEl.textContent = label; },
  onTranscript: addLine,
  onLevel(v) { core.style.setProperty("--level", v.toFixed(3)); },
  onLink(live) {
    linkEl.textContent = live ? "live" : "offline";
    linkEl.classList.toggle("live", live);
    if (!live) { controls.classList.remove("ready"); restored = false; }
  },
  onBotTurnEnd() {
    const last = scroll.lastElementChild;
    if (last && last.dataset) delete last.dataset.open;
  },
});

core.addEventListener("click", () => {
  if (session.connected) session.end(); else session.connect();
});

voiceSel.addEventListener("change", () => session.voiceConfig({ voice: voiceSel.value }));
// `input` moves the readout with the thumb; only `change` (pointer up)
// sends. Sending on every input event would fire dozens of messages
// across one drag, and the last reply to arrive is not necessarily the
// last value chosen.
speedEl.addEventListener("input", () => {
  speedVal.textContent = Number(speedEl.value).toFixed(2) + "×";
});
speedEl.addEventListener("change", () => session.voiceConfig({ speed: Number(speedEl.value) }));
</script>
</body>
</html>
