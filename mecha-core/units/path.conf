# PATH for a user unit is the manager's, not a login shell's, and the manager
# only gains ~/.local/bin when a graphical login imports it. After the
# 2026-09-05 reboot nobody logged in at the console, so llama-embed restarted
# every 10s for eight hours on `llama-server: not found` (2951 restarts)
# while the binary sat in ~/.local/bin the whole time. Name the path here so
# the service does not depend on someone sitting at the machine.
#
# The same drop-in llama-local and llama-embed carry, installed as
# llama-ocr.service.d/path.conf by scripts/llama/install.sh. %h is the home
# directory.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
