[package]
name = "mecha-core"
description = "Provider-agnostic agent harness: loop, tools, MCP client, sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
dirs.workspace = true
futures.workspace = true
image.workspace = true
libc.workspace = true
matrixmultiply.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2 = "0.11"
# The image library's browse lock: the one password the web surface holds,
# hashed with a vetted KDF rather than a hand-rolled one.
argon2 = "0.6"
toml_edit = "0.25"

# Landlock is a Linux LSM; the crate does not build elsewhere. Everything
# that uses it in sandbox.rs is behind cfg(target_os = "linux").
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
