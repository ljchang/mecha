[package]
name = "mecha-core"
description = "Provider-agnostic agent harness: loop, tools, MCP client, sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
dirs.workspace = true
futures.workspace = true
image.workspace = true
libc.workspace = true
matrixmultiply.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2 = "0.11"
# The image library's browse lock: the one password the web surface holds,
# hashed with a vetted KDF rather than a hand-rolled one.
argon2 = "0.6"
toml_edit = "0.25"
# Code mode's interpreter (`interpreter/monty.rs`, CODE-MODE-DESIGN.md §7):
# programs run in `monty-pool`'s subprocess workers, never in-process. Pinned
# exactly, because the worker binary (`interpreter/worker.rs`) is pinned to
# the same release and the two speak one wire protocol. Optional and off by
# default: monty-pool needs Rust 1.96 (the workspace promises 1.89), and its
# WebSocket transport, which mecha never uses, brings rustls with aws-lc.
monty-pool = { version = "=1.4.0", optional = true }
monty-types = { version = "=1.4.0", optional = true }
# Unpacking the worker from its wheel (a zip); already in the tree.
flate2 = "1"

[features]
# The monty backend for code mode, and the worker pool it drives.
monty = ["dep:monty-pool", "dep:monty-types"]

# Landlock is a Linux LSM; the crate does not build elsewhere. Everything
# that uses it in sandbox.rs is behind cfg(target_os = "linux").
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
